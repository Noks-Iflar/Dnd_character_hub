name: Deploy Supabase functions

# Deploys the Edge Functions (Telegram notifications) when they change on main.
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens)
# and SUPABASE_PROJECT_REF (the "<ref>" in https://<ref>.supabase.co). Without them the job is skipped.
# The bot token is NOT here: it lives only in Supabase → Edge Functions → Secrets.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Secrets present?
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF to repository secrets to deploy the functions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Telegram and the database call these two without a Supabase login: they check their own secrets
      - if: steps.check.outputs.skip != 'true'
        run: npx --yes supabase@2.122.0 functions deploy notify telegram-webhook --no-verify-jwt --use-api --project-ref "$PROJECT_REF"
      # Called from the app by a signed-in person: the login is checked by Supabase
      - if: steps.check.outputs.skip != 'true'
        run: npx --yes supabase@2.122.0 functions deploy telegram-link --use-api --project-ref "$PROJECT_REF"
